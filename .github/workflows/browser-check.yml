name: Browser UI checks
on:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  chromium:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install Playwright test runner
        run: npm install --no-save --no-package-lock @playwright/test
      - name: Install Chromium and operating-system dependencies
        run: npx playwright install --with-deps chromium
      - name: Run responsive, navigation, theme, language, and WhatsApp checks
        run: npx playwright test tests/browser.spec.cjs --reporter=line
      - name: Upload browser screenshots
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: nakebusen-browser-evidence
          path: test-results/evidence/
          if-no-files-found: warn
          retention-days: 7
