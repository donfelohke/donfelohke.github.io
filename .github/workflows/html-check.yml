name: Static HTML checks
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Verify required files
        run: |
          test -f index.html
          test -f README.md
          test -f LICENSE
          test -f sitemap.xml
          test -f robots.txt
          test -f tests/test_site.py
      - name: Parse and validate HTML, internal links, metadata and service catalogue
        run: python3 tests/test_site.py
