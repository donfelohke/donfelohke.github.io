name: Static HTML checks
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify required files
        run: |
          test -f index.html
          test -f README.md
          test -f LICENSE
          test -f assets/favicon.svg
          test -f sitemap.xml
          test -f robots.txt
          test -f tests/test_site.py
          test -f tests/theme-toggle.test.cjs
      - name: Parse and validate HTML, internal links, metadata and service catalogue
        run: python3 tests/test_site.py
      - name: Test theme toggle preference behavior
        run: node tests/theme-toggle.test.cjs
