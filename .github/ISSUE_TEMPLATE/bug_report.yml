name: Bug report
description: Report a reproducible problem with the public site.
title: "[Bug]: "
labels: [bug]
body:
  - type: textarea
    id: summary
    attributes:
      label: What happened?
      description: Describe the problem and expected behaviour.
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
    validations:
      required: true
  - type: input
    id: device
    attributes:
      label: Browser/device
  - type: textarea
    id: evidence
    attributes:
      label: Evidence
      description: Remove personal or private information from screenshots.
